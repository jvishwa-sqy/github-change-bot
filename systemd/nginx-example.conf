# /etc/nginx/sites-available/code-change-bot
#
# Public entry point for the GitHub webhook only. TLS is terminated here and
# assumed to be issued by the company's normal certificate infrastructure.

upstream git_change_bot {
    server 127.0.0.1:8088;
    keepalive 8;
}

# Plain HTTP exists only to redirect.
server {
    listen 80;
    listen [::]:80;
    server_name code-change-bot.company.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name code-change-bot.company.com;

    ssl_certificate     /etc/ssl/certs/code-change-bot.company.com.crt;
    ssl_certificate_key /etc/ssl/private/code-change-bot.company.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # GitHub caps webhook payloads at 25 MB; monorepo pushes get close.
    client_max_body_size 25m;
    client_body_timeout  30s;

    access_log /var/log/nginx/code-change-bot.access.log;
    error_log  /var/log/nginx/code-change-bot.error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The only publicly reachable path.
    location = /webhooks/github {
        proxy_pass http://git_change_bot;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The signature covers the raw body: never let nginx alter it.
        proxy_request_buffering on;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Health check, restricted to the monitoring network.
    location = /health {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://git_change_bot;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        return 404;
    }
}

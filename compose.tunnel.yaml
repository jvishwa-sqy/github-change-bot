# Optional no-cost testing tunnel. Start it with:
# docker compose -f compose.yaml -f compose.tunnel.yaml up --build -d
#
# The trycloudflare.com URL is temporary; obtain it with:
# docker compose -f compose.yaml -f compose.tunnel.yaml logs tunnel
services:
  tunnel:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    command: tunnel --no-autoupdate --url http://web:8088
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

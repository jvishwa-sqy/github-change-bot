services:
  web:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - bot-data:/var/lib/git-change-bot
      # Mount a directory containing the read-only deploy key when using SSH.
      - ${BOT_SSH_DIR:?set BOT_SSH_DIR}:/home/gitbot/.ssh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "app.worker"]
    volumes:
      - bot-data:/var/lib/git-change-bot
      - ${BOT_SSH_DIR:?set BOT_SSH_DIR}:/home/gitbot/.ssh:ro
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy

volumes:
  bot-data:

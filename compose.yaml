services:
  web:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      GIT_SSH_COMMAND: ssh -i /home/gitbot/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new
    volumes:
      - bot-data:/var/lib/git-change-bot
      - ${BOT_SSH_DIR:?set BOT_SSH_DIR}:/run/host-ssh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "app.worker"]
    environment:
      GIT_SSH_COMMAND: ssh -i /home/gitbot/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new
    volumes:
      - bot-data:/var/lib/git-change-bot
      - ${BOT_SSH_DIR:?set BOT_SSH_DIR}:/run/host-ssh:ro
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy

  # Free public HTTPS URL for testing. Read the generated trycloudflare.com
  # URL with: docker compose logs tunnel
  tunnel:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    command: tunnel --no-autoupdate --url http://web:8088
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bot-data:
